# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 500
format = """$directory$kubernetes$git_state$git_branch$git_commit$git_status$java$nodejs$helm
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 2
truncation_symbol = ".../"
repo_root_style = "bold lavender"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic sky"
only_attached = true
ignore_branches = ['master', 'main']

[git_commit]
format = '[$hash]($style) '
style = "italic sky"
tag_disabled = false
tag_symbol = ''

[git_state]

[git_status]
format = "[$all_status]($style)"
style = "sky"
ahead = "↑${count} "
diverged = "↑${ahead_count}↓${behind_count} "
behind = "↓${count} "
conflicted = "↔ "
up_to_date = "✓ "
untracked = "? "
modified = "! "
stashed = ""
staged = ""
renamed = ""
deleted = ""

[java]
format = "[${version}]($style) "
version_format = "v${major}"
style = "bold blue"

[nodejs]
format = "[node ${version}]($style) "
version_format = "v${major}"
style = "bold green"

[helm]
format = "[helm ${version}]($style) "
style = "bold peach"

[kubernetes]
detect_files = ['helmfile.yaml', 'Chart.yaml']
disabled = false
format = '[$symbol](overlay1) [$context( \($namespace\))]($style) '
symbol = '⎈'

[[kubernetes.contexts]]
context_pattern = "^docker*"
context_alias = "local"
style = "italic blue"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
