[metadata]
name = "tmux-windows"
description = "List and switch between tmux windows"
requirements = [ "tmux",]

[source]
no_sort = true
command = "tmux list-windows -a -F '#{window_activity}:#{window_last_flag}:#{session_name}:#{window_index}\t#{window_name}\t#{pane_current_command}' | sort -t: -k2 -rn -k1 -rn | sed 's/^[^:]*:[^:]*://'"
display = "{split:\t:0} - {split:\t:1} ({split:\t:2})"
output = "{split:\t:0}"

[preview]
command = "tmux capture-pane -t '{split:\t:0}' -p 2>/dev/null || echo 'No preview available'"

[keybindings]
enter = "actions:select"
x = "actions:kill"

[actions.select]
description = "Switch to the selected window"
command = "tmux switch-client -t '{split:\t:0}'"
mode = "execute"

[actions.kill]
description = "Kill the selected window"
command = "tmux kill-window -t '{split:\t:0}'"
mode = "fork"

