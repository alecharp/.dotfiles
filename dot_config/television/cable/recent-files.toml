[metadata]
name = "recent-files"
description = "Recently modified files"
requirements = ["fd"]

[source]
command = "fd -t f --changed-within 7d"

[preview]
command = "bat -n --color=always '{}'"

[keybindings]
ctrl-e = "actions:edit"

[actions.edit]
description = "Edit selected file"
command = "nvim '{}'"
mode = "execute"
